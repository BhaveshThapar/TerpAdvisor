services:
  - type: web
    name: terpadvisor-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false   # set to the Neon direct connection string in the Render dashboard
      - key: CORS_ORIGINS
        sync: false   # set to ["https://your-app.vercel.app"] in Render dashboard
      - key: REDIS_ENABLED
        value: "false"   # no Redis: cache still uses in-process LRU + Postgres (Neon)
      # To add Redis later, set REDIS_URL (sync: false) and REDIS_ENABLED=true.
